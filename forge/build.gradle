plugins {
    id 'net.minecraftforge.gradle' version '6.0.25'
}

// Toolchain inherited from root build.gradle (JavaLanguageVersion.of(21))

dependencies {
    minecraft 'net.minecraftforge:forge:26.1.2-64.0.8'
    implementation project(':common')
}

minecraft {
    mappings channel: 'official', version: '1.20.4'
    
    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
        }
    }
}

jar {
    archiveBaseName = 'RedstoneReboot-Forge'
    from(project(':common').sourceSets.main.output) {
        into('/')
    }
}

processResources {
    filesMatching('META-INF/mods.toml') {
        expand(version: project.version)
    }
}
