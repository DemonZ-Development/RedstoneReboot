# RedstoneReboot v1.5.0 Configuration
# Advanced multi-platform server restart engine.
# GitHub: https://github.com/DemonZ-Development/RedstoneReboot
# Wiki: https://github.com/DemonZ-Development/RedstoneReboot/wiki
#
# === Migration Guide ===
# v1.4.1 -> v1.4.2:
#   - No config changes required.
#
# v1.4.0 -> v1.4.1:
#   - No config changes required.
#
# v1.3.3 -> v1.4.0:
#   - Removed: permissions.luckperms.default-permission (unused)
#   - Removed: permissions.luckperms.admin-permission (unused)
#   - Removed: advanced.async-operations (unused)
#   - Removed: advanced.thread-pool-size (unused)
# No action required — stale keys are ignored by the parser.
#
# === Getting Started ===
# Set up your restart schedule under `scheduled-restarts:`.
# Configure a backend (Pterodactyl, Systemd, Docker, or LocalScript) via
# the `restart-backends.properties` file in the plugin data folder.
# Tutorial: https://github.com/DemonZ-Development/RedstoneReboot/wiki/Getting-Started

general:
  plugin-prefix: "§8[§cRedstone§8] §aReboot"
  debug-mode: false
  strict-validation: true

scheduled-restarts:
  enabled: true
  times:
    - "06:00"
    - "12:00"
    - "18:00"
    - "00:00"
  timezone: "Europe/London"
  days:
    - "ALL"
  warning-time: 300

alerts:
  enabled: true
  warning-times: [3600, 1800, 900, 600, 300, 180, 120, 60, 30, 15, 10, 5, 4, 3, 2, 1]

  chat:
    enabled: true
    format: "§8[§cRedstone§8] §eServer will restart in §c{time}§e!"

  title:
    enabled: true
    main-title: "§c⚡ Server Restart"
    sub-title: "§ein §c{time}"

  actionbar:
    enabled: true
    format: "§8[§cRedstone§8] §eRestart in: §c{time}"

  sound:
    enabled: true
    sound-name: "BLOCK_NOTE_BLOCK_PLING"

monitoring:
  enabled: true
  tps-threshold: 18.0
  memory-threshold: 85.0
  check-interval: 30
  consecutive-checks: 3

emergency:
  enabled: true
  tps-threshold: 12.0
  memory-threshold: 95.0
  delay: 30

permissions:
  luckperms:
    integration-enabled: true
  fallback:
    use-op-as-admin: true
    default-level: 2 # Default permission level for mod-platform commands.
    public-permissions-enabled: true # Grant status/use/notify to all players

placeholders:
  enabled: true

advanced:
  metrics-enabled: true
  shutdown-delay-ticks: 60
  backup-on-migration: true

config-version: 3
