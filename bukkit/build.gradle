plugins {
    id 'com.gradleup.shadow' version '8.3.0'
}

dependencies {
    implementation project(':common')
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly 'org.jetbrains:annotations:25.0.0'
    implementation 'net.kyori:adventure-platform-bukkit:4.3.0'
    implementation 'net.kyori:adventure-text-minimessage:4.13.0'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.13.0'
    implementation 'org.bstats:bstats-bukkit:3.0.2'
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.github.seeseemelk:MockBukkit-v1.20:3.9.0'
    testImplementation 'me.clip:placeholderapi:2.11.5'
}

shadowJar {
    archiveBaseName = 'RedstoneReboot-Bukkit'
    archiveClassifier = ''
    mergeServiceFiles()

    relocate 'org.bstats', 'dev.demonz.redstonereboot.libs.bstats'
    relocate 'net.kyori.adventure', 'dev.demonz.redstonereboot.libs.kyori.adventure'
    relocate 'net.kyori.examination', 'dev.demonz.redstonereboot.libs.kyori.examination'
}

assemble.dependsOn shadowJar

jar {
    archiveBaseName = 'RedstoneReboot-Bukkit'
    archiveClassifier = 'thin'
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}
