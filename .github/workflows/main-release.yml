name: Main Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to publish to the main release channel
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: main-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve publish ref
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "checkout_ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Validate release ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.ref }}" != refs/heads/main ]]; then
            echo "::error::Release can only be triggered from main branch"
            exit 1
          fi

      - name: Resolve commit SHA
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version
        id: version
        run: |
          version=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Collect release files
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p release-artifacts
          cp "bukkit/build/libs/RedstoneReboot-Bukkit-$version.jar" release-artifacts/
          cp "folia/build/libs/RedstoneReboot-Folia-$version.jar" release-artifacts/
          cp "fabric/build/libs/RedstoneReboot-Fabric-$version.jar" release-artifacts/
          cp "forge/build/libs/RedstoneReboot-Forge-$version.jar" release-artifacts/
          cp "neoforge/build/libs/RedstoneReboot-NeoForge-$version.jar" release-artifacts/
          cd release-artifacts
          sha256sum *.jar > checksums-sha256.txt

      - name: Upload main release bundle
        uses: actions/upload-artifact@v7
        with:
          name: RedstoneReboot-Main-Release
          path: release-artifacts/*
          retention-days: 30

      - name: Move main tag to current commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f main
          git push origin refs/tags/main --force

      - name: Publish main release channel
        uses: softprops/action-gh-release@v3
        with:
          tag_name: main
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: RedstoneReboot Main (${{ steps.version.outputs.version }})
          body: |
            ## RedstoneReboot Main

            Rolling prerelease channel built from `main`.

            - Version: `${{ steps.version.outputs.version }}`
            - Commit: `${{ steps.commit.outputs.sha }}`

            ### Files
            | Platform | File |
            |----------|------|
            | Bukkit / Spigot / Paper / Purpur | `RedstoneReboot-Bukkit-*.jar` |
            | Folia | `RedstoneReboot-Folia-*.jar` |
            | Fabric | `RedstoneReboot-Fabric-*.jar` |
            | Forge | `RedstoneReboot-Forge-*.jar` |
            | NeoForge | `RedstoneReboot-NeoForge-*.jar` |

            ### Links
            - [Documentation](https://github.com/DemonZ-Development/RedstoneReboot/wiki)
            - [Developer API](https://github.com/DemonZ-Development/RedstoneReboot/blob/main/docs/api/README.md)
            - [Issues](https://github.com/DemonZ-Development/RedstoneReboot/issues)
          draft: false
          prerelease: true
          generate_release_notes: false
          make_latest: false
          overwrite_files: true
          files: |
            release-artifacts/RedstoneReboot-Bukkit-${{ steps.version.outputs.version }}.jar
            release-artifacts/RedstoneReboot-Folia-${{ steps.version.outputs.version }}.jar
            release-artifacts/RedstoneReboot-Fabric-${{ steps.version.outputs.version }}.jar
            release-artifacts/RedstoneReboot-Forge-${{ steps.version.outputs.version }}.jar
            release-artifacts/RedstoneReboot-NeoForge-${{ steps.version.outputs.version }}.jar
            release-artifacts/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
