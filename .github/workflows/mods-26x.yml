name: Minecraft 26.x mods

on:
  workflow_dispatch:
  push:
    paths:
      - 'modern/**'
      - 'common/**'
      - '.github/workflows/mods-26x.yml'
  pull_request:
    paths:
      - 'modern/**'
      - 'common/**'
      - '.github/workflows/mods-26x.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1', '26.2']
        loader: [fabric, forge, neoforge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Build and test
        shell: pwsh
        run: gradle -p modern :${{ matrix.loader }}:build :common:test '-PminecraftVersion=${{ matrix.minecraft }}' --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: redstonereboot-${{ matrix.loader }}-mc${{ matrix.minecraft }}
          path: |
            modern/${{ matrix.loader }}/build/${{ matrix.minecraft }}/libs/*.jar
            modern/common/build/${{ matrix.minecraft }}/test-results/test/*.xml
