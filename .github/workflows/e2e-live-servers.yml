name: Packaged server smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-live-servers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-artifacts:
    name: Build & Package Platform JARs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and Run Unit/Integration Tests
        run: ./gradlew build --no-daemon

      - name: Collect E2E JARs
        run: |
          version=$(sed -n "s/^[[:space:]]*version = '\\([^']*\\)'.*/\\1/p" build.gradle | head -n 1)
          mkdir -p build-output
          cp "bukkit/build/libs/RedstoneReboot-Bukkit-$version.jar" build-output/
          cp "folia/build/libs/RedstoneReboot-Folia-$version.jar" build-output/
          cp "fabric/build/libs/RedstoneReboot-Fabric-$version.jar" build-output/
          cp "forge/build/libs/RedstoneReboot-Forge-$version.jar" build-output/
          cp "neoforge/build/libs/RedstoneReboot-NeoForge-$version.jar" build-output/

      - name: Upload Build Artifacts for E2E Testing
        uses: actions/upload-artifact@v7
        with:
          name: E2E-Server-JARs
          path: build-output/*

  e2e-paper-server:
    name: Live E2E - Paper Server (MC 1.20.4)
    needs: build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: E2E-Server-JARs
          path: build-output

      - name: Prepare Paper Server Environment
        run: |
          mkdir -p paper-server/plugins/RedstoneReboot
          echo "eula=true" > paper-server/eula.txt
          cp build-output/RedstoneReboot-Bukkit-*.jar paper-server/plugins/
          
          cat << 'EOF' > paper-server/plugins/RedstoneReboot/config.yml
          enabled: true
          scheduled_restarts:
            enabled: false
          health_monitoring:
            enabled: true
            tps_threshold: 15.0
            memory_threshold_percent: 90.0
            check_interval_seconds: 5
            consecutive_checks_required: 2
          EOF

      - name: Download Paper Server API Jar
        run: |
          cd paper-server
          agent="RedstoneReboot-CI/1.0 (https://github.com/DemonZ-Development/RedstoneReboot)"
          url=$(curl -fsSL -H "User-Agent: $agent" "https://fill.papermc.io/v3/projects/paper/versions/1.20.4/builds" | jq -er 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url)')
          curl -fsSL -H "User-Agent: $agent" -o paper.jar "$url"

      - name: Launch Live Paper Server & Verify Plugin Enable
        run: |
          cd paper-server
          (sleep 35 && echo "reboot status" && sleep 5 && echo "reboot reload" && sleep 5 && echo "stop") | java -Xms512M -Xmx1024M -jar paper.jar --nogui > server.log 2>&1 || true
          cat server.log
          grep -i "RedstoneReboot" server.log || (echo "ERROR: RedstoneReboot plugin failed to enable on Paper server" && exit 1)

  e2e-folia-server:
    name: Live E2E - Folia 1.20.4 build 31 (alpha)
    needs: build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: E2E-Server-JARs
          path: build-output

      - name: Prepare Folia Server Environment
        run: |
          mkdir -p folia-server/plugins/RedstoneReboot
          echo "eula=true" > folia-server/eula.txt
          cp build-output/RedstoneReboot-Folia-*.jar folia-server/plugins/

      - name: Download Folia Server Jar
        run: |
          cd folia-server
          agent="RedstoneReboot-CI/1.0 (https://github.com/DemonZ-Development/RedstoneReboot)"
          url=$(curl -fsSL -H "User-Agent: $agent" "https://fill.papermc.io/v3/projects/folia/versions/1.20.4/builds" | jq -er 'first(.[] | select(.id == 31) | .downloads."server:default".url)')
          curl -fsSL -H "User-Agent: $agent" -o folia.jar "$url"

      - name: Launch Live Folia Server & Verify Plugin Enable
        run: |
          cd folia-server
          (sleep 35 && echo "reboot status" && sleep 5 && echo "stop") | java -Xms512M -Xmx1024M -jar folia.jar --nogui > server.log 2>&1 || true
          cat server.log
          grep -i "RedstoneReboot" server.log || (echo "ERROR: RedstoneReboot plugin failed to enable on Folia server" && exit 1)

  e2e-fabric-server:
    name: Live E2E - Fabric Server (MC 1.20.1)
    needs: build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: E2E-Server-JARs
          path: build-output

      - name: Prepare Fabric Server Environment
        run: |
          mkdir -p fabric-server/mods
          echo "eula=true" > fabric-server/eula.txt
          cp build-output/RedstoneReboot-Fabric-*.jar fabric-server/mods/

      - name: Download Fabric Installer & Setup Server
        run: |
          cd fabric-server
          curl -sSL -o fabric-installer.jar "https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.0.1/fabric-installer-1.0.1.jar"
          java -jar fabric-installer.jar server -mcversion 1.20.1 -loader 0.16.14 -downloadMinecraft
          curl -fsSL -o mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.92.2+1.20.1/fabric-api-0.92.2+1.20.1.jar"

      - name: Launch Live Fabric Server & Verify Mod Loading
        run: |
          cd fabric-server
          (sleep 35 && echo "reboot status" && sleep 5 && echo "stop") | java -Xms512M -Xmx1024M -jar fabric-server-launch.jar nogui > server.log 2>&1 || true
          cat server.log
          grep -i "RedstoneReboot" server.log || (echo "ERROR: RedstoneReboot mod failed to initialize on Fabric server" && exit 1)
