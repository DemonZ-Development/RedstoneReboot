name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v1.6.4
      target:
        description: Branch or commit to release from
        required: true
        default: main
      prerelease:
        description: Mark this release as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      target_commitish: ${{ steps.meta.outputs.target_commitish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "target_commitish=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "target_commitish=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(sed -n "s/^[[:space:]]*version = '\([^']*\)'.*/\1/p" build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::Could not read the project version"
            exit 1
          fi
          if [ "${{ steps.meta.outputs.tag_name }}" != "v$version" ]; then
            echo "::error::Tag ${{ steps.meta.outputs.tag_name }} does not match project version $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build-stable:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Collect stable release files
        shell: bash
        run: |
          version="${{ needs.metadata.outputs.version }}"
          mkdir -p stable-artifacts
          cp "bukkit/build/libs/RedstoneReboot-Bukkit-$version.jar" stable-artifacts/
          cp "folia/build/libs/RedstoneReboot-Folia-$version.jar" stable-artifacts/
          cp "fabric/build/libs/RedstoneReboot-Fabric-$version.jar" stable-artifacts/
          cp "forge/build/libs/RedstoneReboot-Forge-$version.jar" stable-artifacts/
          cp "neoforge/build/libs/RedstoneReboot-NeoForge-$version.jar" stable-artifacts/

      - name: Upload stable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stable-jars
          path: stable-artifacts/*.jar
          retention-days: 1

  build-modern:
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1', '26.2', '26.3']
        loader: [fabric, forge, neoforge]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Build and test
        shell: pwsh
        run: gradle -p modern :${{ matrix.loader }}:build :common:test '-PminecraftVersion=${{ matrix.minecraft }}' --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: modern-${{ matrix.loader }}-mc${{ matrix.minecraft }}
          path: modern/${{ matrix.loader }}/build/${{ matrix.minecraft }}/libs/*.jar
          retention-days: 1

  publish:
    needs: [metadata, build-stable, build-modern]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum *.jar > checksums-sha256.txt

      - name: Upload full release bundle
        uses: actions/upload-artifact@v7
        with:
          name: RedstoneReboot-Release-${{ needs.metadata.outputs.tag_name }}
          path: release-artifacts/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag_name }}
          target_commitish: ${{ needs.metadata.outputs.target_commitish }}
          name: RedstoneReboot ${{ needs.metadata.outputs.tag_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          files: |
            release-artifacts/*.jar
            release-artifacts/checksums-sha256.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
