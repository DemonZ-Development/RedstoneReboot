name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v1.6.1
      target:
        description: Branch or commit to release from
        required: true
        default: main
      prerelease:
        description: Mark this release as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "target_commitish=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "target_commitish=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(sed -n "s/^[[:space:]]*version = '\([^']*\)'.*/\1/p" build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::Could not read the project version"
            exit 1
          fi
          if [ "${{ steps.meta.outputs.tag_name }}" != "v$version" ]; then
            echo "::error::Tag ${{ steps.meta.outputs.tag_name }} does not match project version $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Collect release files
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          mkdir -p release-artifacts
          cp "bukkit/build/libs/RedstoneReboot-Bukkit-$version.jar" release-artifacts/
          cp "folia/build/libs/RedstoneReboot-Folia-$version.jar" release-artifacts/
          cp "fabric/build/libs/RedstoneReboot-Fabric-$version.jar" release-artifacts/
          cp "forge/build/libs/RedstoneReboot-Forge-$version.jar" release-artifacts/
          cp "neoforge/build/libs/RedstoneReboot-NeoForge-$version.jar" release-artifacts/
          cd release-artifacts
          sha256sum *.jar > checksums-sha256.txt

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: RedstoneReboot-Release-${{ steps.meta.outputs.tag_name }}
          path: release-artifacts/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ steps.meta.outputs.target_commitish }}
          name: RedstoneReboot ${{ steps.meta.outputs.tag_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            release-artifacts/RedstoneReboot-Bukkit-${{ steps.version.outputs.value }}.jar
            release-artifacts/RedstoneReboot-Folia-${{ steps.version.outputs.value }}.jar
            release-artifacts/RedstoneReboot-Fabric-${{ steps.version.outputs.value }}.jar
            release-artifacts/RedstoneReboot-Forge-${{ steps.version.outputs.value }}.jar
            release-artifacts/RedstoneReboot-NeoForge-${{ steps.version.outputs.value }}.jar
            release-artifacts/checksums-sha256.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
