plugins {
    id 'java'
}

allprojects {
    apply plugin: 'java'
    
    group = 'dev.demonz.redstonereboot'
    version = '1.6.2'

    repositories {
        mavenCentral()
        maven {
            url = 'https://maven.minecraftforge.net/'
            content {
                includeGroupByRegex 'net\\.minecraftforge(\\..*)?'
                includeGroup 'de.oceanlabs.mcp'
            }
        }
    }

    java {
        def j21 = JavaVersion.VERSION_21
        def targetVersion = project.name == 'neoforge' ? j21 : JavaVersion.VERSION_17
        toolchain.languageVersion = JavaLanguageVersion.of(project.name == 'neoforge' ? 21 : 17)
        sourceCompatibility = targetVersion
        targetCompatibility = targetVersion
    }


    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
