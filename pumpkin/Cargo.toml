[package]
name = "redstonereboot-pumpkin"
version = "1.6.6"
edition = "2024"
authors = ["Cyrusbye720 <byecyrus@gmail.com>"]
description = "RedstoneReboot restart and server health monitoring engine for Pumpkin MC"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pumpkin-plugin-api = "0.2.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
